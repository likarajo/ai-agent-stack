services:
  issue-api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: >
      bash -lc "pip install -q -r 01-apis/requirements.txt
      && PYTHONPATH=/workspace:/workspace/01-apis python -m uvicorn issue_api.server:app
      --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
